name: 에셋 업스케일(waifu2x)
# assets/ 의 NAI 그림 중 아직 안 키운 것을 waifu2x로 2배 키워 커밋한다. 한 번에 다 못 끝내면 다음 실행이 이어서 한다.
# 남은 게 있으면 끝날 때 스스로 다음 실행을 건다(예약 실행은 GitHub이 늦추거나 건너뛸 때가 있어서 보조로만 둔다).
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      ids:
        description: '키울 에셋 id (공백으로 구분, 비우면 안 키운 것 전부)'
        required: false
permissions:
  contents: write
  actions: write
concurrency: nai-assets
jobs:
  upscale:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pillow
      - name: 키울 게 있나
        id: check
        run: |
          n=$(python3 tools/upscale.py --count)
          echo "n=$n" >> "$GITHUB_OUTPUT"; echo "키울 그림 $n"
      - name: waifu2x 준비(CPU Vulkan)
        if: steps.check.outputs.n != '0'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers libvulkan1 unzip
          curl -sSL -o w.zip https://github.com/nihui/waifu2x-ncnn-vulkan/releases/download/20220728/waifu2x-ncnn-vulkan-20220728-ubuntu.zip
          unzip -q w.zip && mv waifu2x-ncnn-vulkan-20220728-ubuntu waifu2x && chmod +x waifu2x/waifu2x-ncnn-vulkan && rm w.zip
      - name: 키우기
        if: steps.check.outputs.n != '0'
        run: W2X=$PWD/waifu2x python3 tools/upscale.py --minutes 45 ${{ github.event.inputs.ids }}
      - name: 커밋
        if: steps.check.outputs.n != '0'
        run: |
          rm -rf waifu2x
          git config user.name "orpheia-bot"
          git config user.email "orpheia-bot@users.noreply.github.com"
          git add assets/*.webp
          git diff --cached --quiet && exit 0
          git commit -m "에셋 업스케일(waifu2x 2배)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done; exit 1
      - name: 남았으면 다음 실행 걸기
        if: steps.check.outputs.n != '0' && github.event.inputs.ids == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(python3 tools/upscale.py --count); echo "남은 그림 $left"
          [ "$left" != "0" ] && gh workflow run upscale.yml --ref main || true
