name: Gemini CLI
# 이슈·PR 댓글에 "@gemini-cli 할 일"을 적으면 Gemini가 작업한다.
# 코드를 고치면 새 브랜치에 커밋하고 PR을 연다(main에 바로 넣지 않는다).
# 필요: 리포 시크릿 GEMINI_API_KEY,
#       Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests" 켜기.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      request:
        description: 'Gemini에게 시킬 일'
        required: true

concurrency:
  group: gemini-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  gemini:
    # 리포 주인·멤버·협업자가 쓴 요청만 처리한다(아무나 실행 못 하게).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        contains(github.event.comment.body || github.event.issue.body, '@gemini-cli') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                 github.event.comment.author_association || github.event.issue.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: git 사용자 설정
        run: |
          git config user.name  "gemini-cli[bot]"
          git config user.email "gemini-cli[bot]@users.noreply.github.com"

      - name: Gemini 실행
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ github.event.issue.pull_request != null || github.event.pull_request != null }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            너는 GitHub 리포지토리 ${{ github.repository }} 에서 일하는 개발 도우미다. 답은 한국어로 한다.

            요청:
            ${{ github.event.inputs.request || github.event.comment.body || github.event.issue.body }}

            이슈/PR 번호: ${{ github.event.issue.number || github.event.pull_request.number || '없음(수동 실행)' }}
            PR 여부: ${{ github.event.issue.pull_request != null || github.event.pull_request != null }}

            작업 방법:
            1. 필요하면 `gh issue view` / `gh pr view` / `gh pr diff` 로 맥락을 읽는다.
            2. 코드를 고쳐야 하면 `gemini/` 로 시작하는 새 브랜치를 만들어 커밋·푸시하고,
               `gh pr create --base main` 으로 PR을 연다. main에 직접 푸시하지 않는다.
            3. 마지막으로 이슈/PR 번호가 있으면 `gh issue comment <번호> --body "..."` 로
               무엇을 했는지(만든 PR 링크 포함) 짧게 보고한다.
            4. 비밀값(.env, 키, 토큰)은 읽거나 출력하지 않는다.
